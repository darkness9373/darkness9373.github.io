<style>:root{color-scheme:dark;--bg:#0b1220;--card:#111c30;--line:#1e2c45;--txt:#e6eef7;--acc:#38bdf8;--bg2:#060b15;--cell:#0a1426;--mut:#5f7894}:root[data-theme=light]{color-scheme:light;--bg:#eaf3fc;--card:#ffffff;--line:#b7d3ea;--txt:#0e1c2e;--acc:#0284c7;--bg2:#d7e9fa;--cell:#f2f8ff;--mut:#5b7a99}:root[data-theme=light] #grid{background:var(--bg2)}:root[data-theme=light] .cell{background:repeating-conic-gradient(#d3e6f7 0 25%,#eef6ff 0 50%) 0 0/12px 12px}:root[data-theme=light] #zoom{background:repeating-conic-gradient(#c4dcf2 0 25%,#eef6ff 0 50%) 0 0/16px 16px}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:clip}body{background:radial-gradient(800px 400px at 50% -100px,rgba(56,189,248,.15),transparent),var(--bg);color:var(--txt);font-family:monospace;margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px 32px}h1{font-size:18px;letter-spacing:2px;margin:4px 0 12px;color:var(--txt)}h1 span{color:var(--acc)}#meta{margin-top:2px;color:var(--mut);font-size:12px;letter-spacing:1px}#meta b{color:var(--acc)}#bar{position:relative;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.4)}button,select{background:var(--cell);color:var(--txt);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-family:inherit;font-size:14px;cursor:pointer;transition:transform .12s ease,border-color .12s,box-shadow .12s,background .12s}button:hover,select:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:0 4px 16px rgba(56,189,248,.25)}button:active{transform:scale(.96)}select{background-image:repeating-linear-gradient(45deg,rgba(56,189,248,.08) 0 6px,transparent 6px 12px),linear-gradient(var(--cell),var(--cell))}select option{background:var(--cell)}.dd{position:relative;display:inline-block}.dd-list{position:absolute;top:calc(100% + 6px);left:0;min-width:140px;background:repeating-linear-gradient(45deg,rgba(56,189,248,.07) 0 8px,transparent 8px 16px),var(--card);border:1px solid var(--acc);border-radius:12px;padding:6px;z-index:30;box-shadow:0 12px 32px rgba(56,189,248,.25);transform-origin:top center}.dd-list[hidden]{display:none}.dd-list.open{animation:ddOpen .22s ease-out}.dd-list.closing{animation:ddClose .15s ease-in forwards}@keyframes ddOpen{0%{transform:translateY(-10px) scale(.92);opacity:0}70%{transform:translateY(3px) scale(1.03);opacity:1}100%{transform:none;opacity:1}}@keyframes ddClose{to{transform:translateY(-8px) scale(.96);opacity:0}}.dd-item{display:block;width:100%;text-align:left;margin:2px 0;opacity:0;transform:translateX(-8px);animation:itemIn .18s ease-out forwards}.dd-list.open .dd-item:nth-child(1){animation-delay:.02s}.dd-list.open .dd-item:nth-child(2){animation-delay:.05s}.dd-list.open .dd-item:nth-child(3){animation-delay:.08s}.dd-list.open .dd-item:nth-child(4){animation-delay:.11s}.dd-list.open .dd-item:nth-child(5){animation-delay:.14s}.dd-list.open .dd-item:nth-child(6){animation-delay:.17s}.dd-list.open .dd-item:nth-child(7){animation-delay:.2s}.dd-list.open .dd-item:nth-child(8){animation-delay:.23s}.dd-list.open .dd-item:nth-child(9){animation-delay:.26s}.dd-list.open .dd-item:nth-child(10){animation-delay:.29s}@keyframes itemIn{to{opacity:1;transform:none}}.dd-item.on{border-color:var(--acc);box-shadow:0 0 10px rgba(56,189,248,.5)}button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}#exportBtn,#createBtn{background:var(--acc);color:#04121d;border:0;font-weight:700}:root[data-theme=light] #exportBtn,:root[data-theme=light] #createBtn{color:#fff}#exportBtn:hover,#createBtn:hover{box-shadow:0 4px 22px rgba(56,189,248,.6)}#wrap{position:relative;margin:16px auto 0;width:100%;max-width:1920px;overflow-x:auto;overflow-y:visible}#grid{touch-action:pan-x pan-y;display:grid;grid-template-columns:repeat(16,56px);gap:12px;width:max-content;margin:0 auto;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--bg2);box-shadow:0 12px 40px rgba(0,0,0,.5)}.cell{aspect-ratio:1/1;background:repeating-conic-gradient(#0e1930 0 25%,var(--cell) 0 50%) 0 0/12px 12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}.cell canvas{width:100%;height:100%;image-rendering:pixelated;display:block}.cell:hover{transform:scale(1.18);border-color:var(--acc);box-shadow:0 0 16px rgba(56,189,248,.6);z-index:2}.cell.sel{border-color:var(--acc);box-shadow:0 0 10px rgba(56,189,248,.6)}#panel{position:absolute;z-index:10;background:var(--card);color:var(--txt);border:1px solid var(--acc);border-radius:12px;padding:10px;width:max-content;max-width:280px;box-shadow:0 8px 30px rgba(56,189,248,.25);transform-origin:center}@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.07);opacity:1}100%{transform:scale(1);opacity:1}}.pop{animation:pop .2s ease-out}#panel[hidden]{display:none}#newPop{background:repeating-linear-gradient(45deg,rgba(56,189,248,.07) 0 8px,transparent 8px 16px),var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:inline-flex;gap:6px;align-items:center;margin-left:8px;transform-origin:top left}#newPop{position:absolute;top:calc(100% + 8px);left:10px;display:inline-flex;gap:6px;align-items:center;transform-origin:top left;z-index:40}#newPop.open{animation:pop .22s ease-out}#newPop.closing{animation:newClose .16s ease-in forwards}#newPop[hidden]{display:none}@keyframes newClose{to{transform:translateY(-8px) scale(.95);opacity:0}}#cellInfo{color:var(--acc);margin-bottom:8px}#zoom{width:128px;height:128px;image-rendering:pixelated;border:1px solid var(--line);border-radius:8px;background:repeating-conic-gradient(#1a2740 0 25%,#0b1220 0 50%) 0 0/16px 16px}#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--card);border:1px solid var(--acc);color:var(--txt);padding:10px 18px;border-radius:999px;font-size:14px;box-shadow:0 8px 30px rgba(56,189,248,.35);z-index:99;pointer-events:none;opacity:0}#toast.show{opacity:1;animation:toastPop .25s ease-out}#editWrap{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:16px}#editWrap[hidden]{display:none}#editCard{background:var(--card);border:1px solid var(--acc);border-radius:16px;padding:14px;width:max-content;max-width:94vw;box-shadow:0 16px 60px rgba(0,0,0,.5)}#editInfo{color:var(--acc);margin-bottom:10px}#editStage{width:min(88vw,70vh,560px);height:min(62vh,560px);background:repeating-conic-gradient(#1a2740 0 25%,#0b1220 0 50%) 0 0/32px 32px;border:1px solid var(--line);border-radius:12px;overflow:auto;touch-action:none}#editBox{position:relative;width:max-content}#editStage.panning #editCv{cursor:grab}:root[data-theme=light] #editStage{background:repeating-conic-gradient(#c4dcf2 0 25%,#eef6ff 0 50%) 0 0/32px 32px}#editCv{position:relative;display:block;image-rendering:pixelated;cursor:none}#editBox{position:relative;width:max-content;line-height:0}#editSize{background:var(--cell);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 8px;width:70px;font-family:inherit}#sizeWrap{display:inline-flex;align-items:center;gap:2px;background:var(--cell);border:1px solid var(--line);border-radius:12px;padding:4px}#sizeWrap button{min-width:48px;min-height:48px;font-size:22px;line-height:1;padding:6px 12px;touch-action:manipulation}#sizeLbl{min-width:52px;text-align:center;font-size:18px;color:var(--acc);touch-action:manipulation}#editCursor{position:absolute;pointer-events:none;border:2px solid var(--acc);box-shadow:0 0 0 1px rgba(0,0,0,.6);display:none;z-index:5}#editCursor.round{border-radius:50%}#editZoomRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}#editZoomRow .lbl{min-width:64px;text-align:center;color:var(--acc)}#editGrid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(56,189,248,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.22) 1px,transparent 1px)}#editTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#editTools .on{border-color:var(--acc);box-shadow:0 0 10px rgba(56,189,248,.5)}#editTools button:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}#editColor{width:42px;height:37px;padding:2px;border-radius:10px;background:var(--cell);border:1px solid var(--line);cursor:pointer}#editSave{background:var(--acc);color:#04121d;border:0;font-weight:700}:root[data-theme=light] #editSave{color:#fff}@keyframes toastPop{0%{transform:translateX(-50%) scale(.6);opacity:0}70%{transform:translateX(-50%) scale(1.08);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}</style>
<body>
<h1>GLYPH <span>MAKER</span></h1>
<div id="bar">
<button id="newBtn">New</button>
<div id="newPop" hidden>
<div class="dd" id="sizeDD">
<button id="sizeBtn" type="button">256 ▾</button>
<div class="dd-list" id="sizeList" hidden></div>
</div>
<button id="createBtn">Create</button>
<button id="cancelBtn">Cancel</button>
</div>
<button id="baseBtn">Import base</button>
<input type="file" id="baseFile" accept="image/png" hidden>
<div class="dd" id="prefixDD">
<button id="prefixBtn" type="button">F0 ▾</button>
<div class="dd-list" id="prefixList" hidden></div>
</div>
<button id="exportBtn">Export</button>
<button id="themeBtn" title="toggle theme">◐</button>
<span id="saveStat" style="color:var(--mut);font-size:12px"></span>
</div>
<div id="meta">no glyph loaded</div>
<div id="wrap">
<div id="grid"></div>
<div id="panel" hidden>
<div id="cellInfo"></div>
<canvas id="zoom" width="128" height="128"></canvas><br>
<button id="importBtn">Import</button>
<button id="editBtn">Edit</button>
<input type="file" id="cellFile" accept="image/png" hidden>
<button id="copyBtn">Copy unicode</button>
<button id="removeBtn">Remove</button>
</div>
</div>
<footer style="margin-top:16px;color:var(--mut);letter-spacing:1px;font-size:12px">created by: Darkness9373</footer>
<div id="editWrap" hidden>
<div id="editCard" role="dialog" aria-modal="true">
<div id="editInfo"></div>
<div id="editZoomRow">
<button id="zoomOutBtn">−</button>
<span class="lbl" id="zoomLbl">800%</span>
<button id="zoomInBtn">+</button>
<button id="zoomFitBtn">Fit</button>
</div>
<div id="editStage"><div id="editBox"><canvas id="editCv"></canvas><div id="editGrid"></div><div id="editCursor"></div></div></div>
<div id="editTools">
<button id="penBtn" class="on">Pen</button>
<button id="eraserBtn">Eraser</button>
<button id="panBtn">Pan</button>
<input type="color" id="editColor" value="#ffffff">
<div id="sizeWrap" title="pen size"><button id="sizeMinus" type="button">−</button><span id="sizeLbl">1</span><button id="sizePlus" type="button">+</button></div>
<button id="cursorBtn" title="cursor shape">◻</button>
<button id="undoBtn" title="undo">↩</button>
<button id="redoBtn" title="redo">↪</button>
<button id="clearBtn">Clear</button>
<button id="editSave">Save</button>
<button id="editCancel">Cancel</button>
</div>
</div>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const ALLOWED=[64,128,256,512,1024,2048];
let S=0,P=0,cells=new Array(256).fill(null),sel=-1,divs=[];
const grid=$("grid");
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("gm-theme",t)}catch(e){}$("themeBtn").textContent=t==="light"?"◑":"◐"}
$("themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="light"?"dark":"light");
try{const st=localStorage.getItem("gm-theme");if(st)setTheme(st);else setTheme(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){setTheme("dark")}
function buildGrid(){grid.innerHTML="";divs=[];for(let i=0;i<256;i++){const d=document.createElement("div");d.className="cell";const c=document.createElement("canvas");d.appendChild(c);grid.appendChild(d);divs.push(d)}}
const cs=()=>S/16;
const codeOf=i=>0xF000+P*0x100+i;
const hexOf=i=>"U+"+codeOf(i).toString(16).toUpperCase().padStart(4,"0");
function loadImg(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u})}
function loadURL(u){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u})}
let dbP=null,saveT=0,restoring=false;
function db(){if(dbP)return dbP;dbP=new Promise((res,rej)=>{const q=indexedDB.open("glyphmaker",1);q.onupgradeneeded=()=>q.result.createObjectStore("s");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});return dbP}
async function idbSet(k,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction("s","readwrite");t.objectStore("s").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){const d=await db();return new Promise((res,rej)=>{const t=d.transaction("s","readonly");const q=t.objectStore("s").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function queueSave(){if(restoring||!S)return;clearTimeout(saveT);$("saveStat").textContent="saving...";saveT=setTimeout(saveNow,500)}
async function saveNow(){try{const data={S,P,ts:Date.now(),cells:cells.map(c=>c?c.toDataURL():null)};await idbSet("work",data);$("saveStat").textContent="saved "+new Date().toLocaleTimeString()}catch(e){$("saveStat").textContent="save failed"}}
function setMeta(){const m=$("meta");if(!S){m.textContent="no glyph loaded";return}m.innerHTML="glyph_<b>F"+P+"</b> · "+S+"x"+S+" · cell "+cs()+"x"+cs()}
let toastT=0;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.remove("show");void t.offsetWidth;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1600)}
function isBlank(c){const d=c.getContext("2d").getImageData(0,0,c.width,c.height).data;for(let i=3;i<d.length;i+=4)if(d[i]!==0)return false;return true}
function render(){if(!S)return;if(divs.length!==256)buildGrid();const s=cs(),PV=56;for(let i=0;i<256;i++){const cv=divs[i].firstChild;cv.width=PV;cv.height=PV;const x=cv.getContext("2d");x.imageSmoothingEnabled=s>PV;x.imageSmoothingQuality="high";x.clearRect(0,0,PV,PV);if(cells[i])x.drawImage(cells[i],0,0,PV,PV);divs[i].classList.toggle("sel",i===sel)}updatePanel();setMeta();queueSave()}
function updatePanel(){const p=$("panel");if(sel<0||!S){p.hidden=true;divs.forEach(d=>d.classList.remove("sel"));return}const was=p.hidden;p.hidden=false;const filled=!!cells[sel];const col=sel%16,row=(sel/16|0),s=cs();$("cellInfo").textContent="("+col+","+row+") "+hexOf(sel)+" max "+s+"x"+s;$("importBtn").textContent="Import max "+s+"x"+s;$("removeBtn").hidden=!filled;const z=$("zoom").getContext("2d");z.imageSmoothingEnabled=false;z.clearRect(0,0,128,128);if(cells[sel])z.drawImage(cells[sel],0,0,128,128);const fx=col>11,fy=row>12;p.style.left=fx?"auto":(col/16*100)+"%";p.style.right=fx?"0":"auto";p.style.top=fy?"auto":(row/16*100)+"%";p.style.bottom=fy?"0":"auto";if(was){p.classList.remove("pop");void p.offsetWidth;p.classList.add("pop")}}
function openNew(){const n=$("newPop");n.hidden=false;n.classList.remove("closing");n.classList.remove("open");void n.offsetWidth;n.classList.add("open")}
function closeNew(){const n=$("newPop");if(n.hidden||n.classList.contains("closing"))return;n.classList.remove("open");n.classList.add("closing");setTimeout(()=>{n.hidden=true;n.classList.remove("closing")},150)}
$("newBtn").onclick=e=>{e.stopPropagation();$("newPop").hidden?openNew():closeNew()};
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#newPop")&&e.target.id!=="newBtn"&&!$("newPop").hidden)closeNew()},true);
$("cancelBtn").onclick=()=>closeNew();
$("createBtn").onclick=()=>{S=sizeVal;cells=new Array(256).fill(null);sel=-1;closeNew();setTimeout(render,30)};
let sizeVal=256;
const sizeList=$("sizeList");
ALLOWED.forEach((v,i)=>{const b=document.createElement("button");b.className="dd-item"+(v===256?" on":"");b.textContent=v;b.onclick=()=>{sizeVal=v;$("sizeBtn").textContent=v+" ▾";sizeList.querySelectorAll(".dd-item").forEach(x=>x.classList.remove("on"));b.classList.add("on");closeSizeDD()};sizeList.appendChild(b)});
function openSizeDD(){sizeList.hidden=false;sizeList.classList.remove("closing");sizeList.classList.remove("open");void sizeList.offsetWidth;sizeList.classList.add("open")}
function closeSizeDD(){if(sizeList.hidden||sizeList.classList.contains("closing"))return;sizeList.classList.remove("open");sizeList.classList.add("closing");setTimeout(()=>{sizeList.hidden=true;sizeList.classList.remove("closing")},140)}
$("sizeBtn").onclick=e=>{e.stopPropagation();sizeList.hidden?openSizeDD():closeSizeDD()};
document.addEventListener("pointerdown",e=>{if(!$("sizeDD").contains(e.target))closeSizeDD();if(!$("prefixDD").contains(e.target))closePrefixDD()},true);
$("baseBtn").onclick=()=>$("baseFile").click();
const prefixList=$("prefixList");
for(let k=0;k<10;k++){const b=document.createElement("button");b.className="dd-item"+(k===0?" on":"");b.textContent="F"+k;b.onclick=()=>{P=k;$("prefixBtn").textContent="F"+k+" ▾";prefixList.querySelectorAll(".dd-item").forEach(x=>x.classList.remove("on"));b.classList.add("on");closePrefixDD();updatePanel();setMeta();queueSave()};prefixList.appendChild(b)}
function openPrefixDD(){prefixList.hidden=false;prefixList.classList.remove("closing");prefixList.classList.remove("open");void prefixList.offsetWidth;prefixList.classList.add("open")}
function closePrefixDD(){if(prefixList.hidden||prefixList.classList.contains("closing"))return;prefixList.classList.remove("open");prefixList.classList.add("closing");setTimeout(()=>{prefixList.hidden=true;prefixList.classList.remove("closing")},140)}
$("prefixBtn").onclick=e=>{e.stopPropagation();prefixList.hidden?openPrefixDD():closePrefixDD()};
$("baseFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;const im=await loadImg(f);if(im.width!==im.height||!ALLOWED.includes(im.width)){alert("Base harus PNG persegi 64/128/256/512/1024/2048");return}S=im.width;const t=document.createElement("canvas");t.width=S;t.height=S;t.getContext("2d").drawImage(im,0,0);const s=cs();cells=[];for(let r=0;r<16;r++)for(let c=0;c<16;c++){const cc=document.createElement("canvas");cc.width=s;cc.height=s;cc.getContext("2d").drawImage(t,c*s,r*s,s,s,0,0,s,s);cells.push(isBlank(cc)?null:cc)}sel=-1;render();e.target.value=""};
let tapX=0,tapY=0,tapT=0;
document.addEventListener("pointerdown",e=>{tapX=e.clientX;tapY=e.clientY;tapT=Date.now()},true);
document.addEventListener("pointerup",e=>{if($("panel").contains(e.target)||$("editWrap").contains(e.target)||!S)return;if(Math.hypot(e.clientX-tapX,e.clientY-tapY)>10||Date.now()-tapT>600)return;const el=e.target.closest?e.target.closest(".cell"):null;if(el&&grid.contains(el)){const i=divs.indexOf(el);if(i<0)return;if(sel>=0&&!$("panel").hidden){sel=-1;updatePanel();return}sel=i;updatePanel();return}if(sel>=0){sel=-1;updatePanel()}},true);
$("importBtn").onclick=()=>$("cellFile").click();
$("cellFile").onchange=async e=>{const f=e.target.files[0];if(!f||sel<0)return;const im=await loadImg(f);const s=cs();if(im.width>s||im.height>s){alert("Isi max "+s+"x"+s+", dapat "+im.width+"x"+im.height);return}const c=document.createElement("canvas");c.width=s;c.height=s;const x=c.getContext("2d");x.imageSmoothingEnabled=false;x.drawImage(im,(s-im.width)/2,(s-im.height)/2);cells[sel]=c;render();toast("imported "+im.width+"x"+im.height+" → "+hexOf(sel));e.target.value=""};
$("copyBtn").onclick=async()=>{if(sel<0)return;const ch=String.fromCodePoint(codeOf(sel));try{await navigator.clipboard.writeText(ch)}catch(_){const t=document.createElement("textarea");t.value=ch;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}toast("copied "+hexOf(sel))};
$("removeBtn").onclick=()=>{if(sel<0)return;const h=hexOf(sel);cells[sel]=null;render();toast("removed "+h)};
let edN=0,edTool="pen",edDown=false,edZ=8,edSize=1,edCursorShape="square",edLast=null,edDrew=false,edPanning=false,edPanSX=0,edPanSY=0,edPanSL=0,edPanST=0,edHist=[],edIdx=-1;
const ED_MAX=50;
const editCv=$("editCv"),editX=editCv.getContext("2d"),editStage=$("editStage"),editGrid=$("editGrid"),editCursor=$("editCursor");
const ED_ZOOMS=[1,2,3,4,6,8,12,16,24,32];
function hex2rgba(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255]}
function editSizeVal(v){if(v!==undefined)edSize=Math.max(1,Math.min(edN||32,v));else edSize=Math.max(1,Math.min(edN||32,edSize||1));$("sizeLbl").textContent=edSize;return edSize}
function sizeStep(d){editSizeVal(edSize+d);applyZoom()}
$("sizeMinus").onclick=()=>sizeStep(-1);
$("sizePlus").onclick=()=>sizeStep(1);
function applyZoom(){editCv.style.width=edN*edZ+"px";editCv.style.height=edN*edZ+"px";editGrid.style.backgroundSize=edZ+"px "+edZ+"px";$("zoomLbl").textContent=edZ*100+"%";if(editCursor.style.display==="block"){editCursor.style.width=edSize*edZ+"px";editCursor.style.height=edSize*edZ+"px"}}
function zStep(d){const n=d>0?ED_ZOOMS.find(z=>z>edZ):[...ED_ZOOMS].reverse().find(z=>z<edZ);if(n){edZ=n;applyZoom()}}
function editFit(){const w=editStage.clientWidth||480,h=editStage.clientHeight||480;const f=Math.max(1,Math.min(32,Math.floor(Math.min(w,h)/Math.max(1,edN))||1));edZ=ED_ZOOMS.filter(z=>z<=f).pop()||1;applyZoom();editStage.scrollLeft=(editStage.scrollWidth-editStage.clientWidth)/2;editStage.scrollTop=(editStage.scrollHeight-editStage.clientHeight)/2}
$("zoomInBtn").onclick=()=>zStep(1);
$("zoomOutBtn").onclick=()=>zStep(-1);
$("zoomFitBtn").onclick=editFit;
editStage.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();zStep(e.deltaY<0?1:-1)},{passive:false});
function setTool(t){edTool=t;["pen","eraser","pan"].forEach(k=>$(k==="pan"?"panBtn":k+"Btn").classList.toggle("on",k===t));editStage.classList.toggle("panning",t==="pan");editCv.style.cursor=t==="pan"?"grab":"none";if(t==="pan")editCursor.style.display="none"}
function editPos(e){const r=editCv.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*edN,py=(e.clientY-r.top)/r.height*edN;return[Math.min(edN-1,Math.max(0,px|0)),Math.min(edN-1,Math.max(0,py|0))]}
function editDot(px,py){const r0=-(edSize>>1);const id=editX.getImageData(0,0,edN,edN),d=id.data;const pen=edTool==="pen";const cc=pen?hex2rgba($("editColor").value):null;const rad=edSize/2;for(let dy=0;dy<edSize;dy++)for(let dx=0;dx<edSize;dx++){if(edCursorShape==="round"){const cx=dx-rad+0.5,cy=dy-rad+0.5;if(cx*cx+cy*cy>rad*rad)continue}const x=px+r0+dx,y=py+r0+dy;if(x<0||y<0||x>=edN||y>=edN)continue;const o=(y*edN+x)*4;if(pen){d[o]=cc[0];d[o+1]=cc[1];d[o+2]=cc[2];d[o+3]=255}else{d[o+3]=0}}editX.putImageData(id,0,0)}
function editLine(x0,y0,x1,y1){let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0);const sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx-dy,x=x0,y=y0;for(;;){editDot(x,y);if(x===x1&&y===y1)break;const e2=2*err;if(e2>-dy){err-=dy;x+=sx}if(e2<dx){err+=dx;y+=sy}}}
function moveCursor(e){if(edTool==="pan")return;editSizeVal();const[px,py]=editPos(e);const r0=-(edSize>>1);editCursor.style.display="block";editCursor.classList.toggle("round",edCursorShape==="round");editCursor.style.width=edSize*edZ+"px";editCursor.style.height=edSize*edZ+"px";editCursor.style.left=(px+r0)*edZ+"px";editCursor.style.top=(py+r0)*edZ+"px"}
function editWire(e){if(!edDown||edPanning)return;if(e.cancelable)e.preventDefault();const[px,py]=editPos(e);if(edLast)editLine(edLast[0],edLast[1],px,py);else editDot(px,py);edLast=[px,py];edDrew=true}
editCv.addEventListener("pointerdown",e=>{if(edTool==="pan"||e.button===1){if(e.cancelable)e.preventDefault();edPanning=true;edPanSX=e.clientX;edPanSY=e.clientY;edPanSL=editStage.scrollLeft;edPanST=editStage.scrollTop;editCv.setPointerCapture(e.pointerId);editStage.classList.add("panning");return}editSizeVal();edDown=true;edLast=null;edDrew=false;editCv.setPointerCapture(e.pointerId);const[px,py]=editPos(e);editDot(px,py);edDrew=true;edLast=[px,py]});
editCv.addEventListener("pointermove",e=>{if(edPanning){editStage.scrollLeft=edPanSL-(e.clientX-edPanSX);editStage.scrollTop=edPanST-(e.clientY-edPanSY);return}moveCursor(e);editWire(e)});
editCv.addEventListener("pointerleave",()=>{if(!edDown)editCursor.style.display="none"});
function editStop(){if(edDrew)edSnap();edDown=false;edLast=null;edDrew=false;if(edPanning){edPanning=false;if(edTool!=="pan")editStage.classList.remove("panning")}}
editCv.addEventListener("pointerup",editStop);
editCv.addEventListener("pointercancel",editStop);
$("penBtn").onclick=()=>setTool("pen");
$("eraserBtn").onclick=()=>setTool("eraser");
$("panBtn").onclick=()=>setTool("pan");
$("cursorBtn").onclick=e=>{edCursorShape=edCursorShape==="square"?"round":"square";e.target.textContent=edCursorShape==="square"?"◻":"◯";editCursor.classList.toggle("round",edCursorShape==="round")};
function edSync(){const u=$("undoBtn"),r=$("redoBtn");if(u)u.disabled=edIdx<=0;if(r)r.disabled=edIdx<0||edIdx>=edHist.length-1}
function edSnap(){edHist=edHist.slice(0,edIdx+1);try{edHist.push(editX.getImageData(0,0,edN,edN))}catch(e){return}if(edHist.length>ED_MAX)edHist.shift();edIdx=edHist.length-1;edSync()}
function edGo(d){const n=edIdx+d;if(n<0||n>=edHist.length)return;edIdx=n;editX.putImageData(edHist[edIdx],0,0);edSync()}
$("undoBtn").onclick=()=>edGo(-1);
$("redoBtn").onclick=()=>edGo(1);
$("clearBtn").onclick=()=>{edSnap();editX.clearRect(0,0,edN,edN)};
$("editCancel").onclick=()=>$("editWrap").hidden=true;
$("editSave").onclick=()=>{if(sel<0)return;const c=document.createElement("canvas");c.width=edN;c.height=edN;const x=c.getContext("2d");x.imageSmoothingEnabled=false;x.drawImage(editCv,0,0);cells[sel]=isBlank(c)?null:c;$("editWrap").hidden=true;edHist=[];edIdx=-1;edSync();render();toast("edited "+hexOf(sel))};
$("editBtn").onclick=()=>{if(sel<0||!S)return;edN=cs();edSize=1;setTool("pen");editSizeVal();editCv.width=edN;editCv.height=edN;editX.imageSmoothingEnabled=false;editX.clearRect(0,0,edN,edN);if(cells[sel])editX.drawImage(cells[sel],0,0);edHist=[];edIdx=-1;edSnap();$("editWrap").hidden=false;editFit();editCursor.style.display="none";const col=sel%16,row=(sel/16|0);$("editInfo").textContent=`(${(col)},${(row)}) ${hexOf(sel)} · ${edN}x${edN} · brush ${edSize}`};
$("exportBtn").onclick=()=>{if(!S)return;const o=document.createElement("canvas");o.width=S;o.height=S;const x=o.getContext("2d");x.imageSmoothingEnabled=false;const s=cs();for(let i=0;i<256;i++)if(cells[i])x.drawImage(cells[i],(i%16)*s,((i/16)|0)*s);o.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="glyph_F"+P+".png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)})};
(async()=>{try{const d=await idbGet("work");if(!d||!ALLOWED.includes(d.S))return;restoring=true;S=d.S;P=d.P||0;$("prefixBtn").textContent="F"+P+" ▾";prefixList.querySelectorAll(".dd-item").forEach((x,k)=>x.classList.toggle("on",k===P));const s=cs();cells=[];for(const u of d.cells){if(!u){cells.push(null);continue}const im=await loadURL(u);const c=document.createElement("canvas");c.width=s;c.height=s;const rc=c.getContext("2d");rc.imageSmoothingEnabled=false;rc.drawImage(im,0,0);cells.push(c)}sel=-1;render();restoring=false;$("saveStat").textContent="restored "+new Date(d.ts).toLocaleTimeString()}catch(e){restoring=false}})();
</script>
